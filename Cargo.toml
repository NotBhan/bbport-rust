[package]
name = "bbport-launcher-rs"
version = "1.10.12"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of the Bloodborne PC Linux launcher"

[lib]
name = "bbport_launcher"
path = "lib.rs"

[[bin]]
name = "bbport-rs"
path = "main.rs"

[[bin]]
name = "bbport-gui"
path = "gui.rs"

[dependencies]
base64 = "0.22.1"
gtk4 = { version = "0.11.5", features = ["v4_10"] }
crc32fast = "1.5.0"
dirs = "6.0.0"
flate2 = "1.1.9"
libc = "0.2"
quick-xml = "0.39.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "1.0.69"

[profile.release]
lto = true
strip = true
